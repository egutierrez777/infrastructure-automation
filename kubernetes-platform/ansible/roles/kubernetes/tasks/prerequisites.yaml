---
- name: Wait for unattended-upgrades to finish
  ansible.builtin.shell: |
    while pgrep -x unattended-upgrade >/dev/null || \
          fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
          fuser /var/lib/dpkg/lock >/dev/null 2>&1; do
      sleep 5
    done
  changed_when: false

- name: Install Kubernetes prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present
    update_cache: true

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Kubernetes repository signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ hostvars['localhost'].kubernetes_minor_version }}/deb/Release.key"
    dest: /tmp/kubernetes-release.key
    owner: root
    group: root
    mode: "0644"

- name: Convert Kubernetes repository signing key to GPG keyring
  ansible.builtin.command:
    cmd: >
      gpg --dearmor --yes
      --output /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      /tmp/kubernetes-release.key
  changed_when: true

- name: Configure Kubernetes APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://pkgs.k8s.io/core:/stable:/v{{ hostvars['localhost'].kubernetes_minor_version }}/deb/
      /
    filename: kubernetes
    state: present
    update_cache: true

- name: Ensure Kubernetes APT keyring has correct permissions
  ansible.builtin.file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    owner: root
    group: root
    mode: "0644"
