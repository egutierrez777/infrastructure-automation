---
kubernetes_packages:
  - kubelet
  - kubeadm
  - kubectl

kubernetes_stable_release_url: "https://dl.k8s.io/release/stable.txt"

kubernetes_apt_keyring: "/etc/apt/keyrings/kubernetes-apt-keyring.gpg"
kubernetes_apt_sources_list: "/etc/apt/sources.list.d/kubernetes.list"

kubernetes_kernel_modules:
  - overlay
  - br_netfilter

kubernetes_sysctl_settings:
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"
  net.ipv4.ip_forward: "1"

containerd_package: containerd

containerd_config_path: /etc/containerd/config.toml

kubernetes_worker_join_endpoint: >-
  {{ hostvars[groups['load_balancer'][0]]['ansible_host'] }}:6443

kubernetes_worker_join_cri_socket: "unix:///run/containerd/containerd.sock"
kubernetes_worker_join_token_ttl: "30m"
kubernetes_worker_join_timeout: "10m"
