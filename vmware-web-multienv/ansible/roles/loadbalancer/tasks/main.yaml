---
- name: Configure server hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Update facts
  setup:

- name: HAPROXY install
  apt:
    name: haproxy
    state: present

- name: Init HAPROXY service
  service:
    name: haproxy
    state: started
    enabled: true

- name: Upload the load balancer configuration
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: 0644
    validate: "haproxy -c -f %s"
  notify: HAPROXY restart

- name: Apply pending handlers
  meta: flush_handlers

- name: Check load balancer availability
  uri:
    url: http://localhost
    method: GET
    status_code: 200
    return_content: true
  register: loadbalancer_check

- name: Verify load balancer content
  assert:
    that:
      - loadbalancer_check.status == 200
      - loadbalancer_check.content | length > 0
    fail_msg: "Load balancer health check failed"
    success_msg: "Load balancer is working correctly"
